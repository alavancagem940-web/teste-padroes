Bilhete Plus v5.6.6 — Apenas um jogo + Meus bilhetes no Ao Vivo + jogadores nos automáticos

1. Substitua no GitHub os arquivos pelo conteúdo desta pasta.
2. Não envie .env nem node_modules.
3. package.json, server.js e render.yaml devem ficar na raiz do repositório.
4. Faça Commit changes.
5. Aguarde o Render ficar Deployed.
6. Feche e abra novamente o PWA no iPhone para carregar o cache v5.6.6.
